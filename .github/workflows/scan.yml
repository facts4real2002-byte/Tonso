# Skaneri online në GitHub Actions – punon gjithë kohën, pa kompjuter të ndezur.
# - Ekzekutohet çdo orë (minuta 17) kur ky skedar është në degën kryesore (main).
# - Historia e çdo skanimi ruhet në degën `scan-data` (skedari scan_log.csv).
# - Telegram: Settings → Secrets and variables → Actions → shto TELEGRAM_BOT_TOKEN dhe TELEGRAM_CHAT_ID.
# - Për ta ndalur: Actions → "Arbitrage & funding scan" → ⋯ → Disable workflow.
# Shënim: serverët e GitHub janë në SHBA – Binance futures dhe Bybit refuzojnë lidhjen nga atje.
name: Arbitrage & funding scan

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:  # edhe kur ndryshon skaneri (për provë)
    paths:
      - ".github/workflows/scan.yml"
      - "tonso/arb.py"
      - "tonso/exchanges.py"

permissions:
  contents: write  # për të ruajtur historinë në degën scan-data

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Scan
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m tonso scan --exchanges binance,okx,kucoin,gate,bybit --log scan_log.csv | tee scan_report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-report
          path: |
            scan_report.txt
            scan_log.csv
      - name: Save history to scan-data branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv scan_log.csv "$RUNNER_TEMP/new.csv"
          if git fetch -q origin scan-data; then
            git checkout -q -B scan-data origin/scan-data
            tail -n +2 "$RUNNER_TEMP/new.csv" >> scan_log.csv
          else
            git checkout -q --orphan scan-data
            git rm -rq --cached .
            cp "$RUNNER_TEMP/new.csv" scan_log.csv
          fi
          git add -f scan_log.csv
          git commit -qm "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin scan-data
